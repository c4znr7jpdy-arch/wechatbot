# Temporary HTTP-only site used to obtain the first Let's Encrypt certificate.
server {
    listen 80;
    listen [::]:80;
    server_name player.xiuxianjyj.xin;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
