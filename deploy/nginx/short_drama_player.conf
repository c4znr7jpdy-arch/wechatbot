# Public entry for jiang_short_drama's local episode player.
# SSH reverse tunnel:
#   VPS /run/short-drama-player.sock -> Windows bot host 127.0.0.1:6197

upstream short_drama_player_backend {
    server unix:/run/short-drama-player.sock;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name player.xiuxianjyj.xin;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name player.xiuxianjyj.xin;

    ssl_certificate /etc/letsencrypt/live/player.xiuxianjyj.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/player.xiuxianjyj.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ShortDramaTLS:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /short-drama/ {
        proxy_pass http://short_drama_player_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        return 404;
    }
}
